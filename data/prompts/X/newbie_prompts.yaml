schema: newbie-x-table/v1
# NewBie-image Exp0.1 专用 X 轴 prompt 资产。
# 与 data/prompts/X/common_prompts.yaml 的 10 个测试场景一一对应（同角色、同构图、同观察目标），
# 只是把扁平 gender/characters/series/rating/general 字段按语义重新分类到 NewBie XML 子标签结构。
#
# 子标签固定顺序（渲染器按此顺序输出，非空的填、空标签省略）：
#   角色块：n, gender, appearance, clothing, body_type, expression, action, interaction, position
#   全局块：count, artists, style, background, environment, perspective, atmosphere, lighting,
#           quality, objects, other
#
# 字段映射约定：
# - gender        → 角色 <gender> + 全局 <count>（1girl/2girls 等数量描述）
# - characters    → 每个角色独立一个 <character_X> 块，名字进 <n>
# - series        → NewBie XML 无对应子标签，放全局 <other>（必须保留此词条）
# - rating        → 同上，放 <other>
# - general 中的 tag → 按 danbooru 语义人工分类到对应子标签：
#     solo / 多人计数 → <count>
#     cowboy shot / full shot / portrait / face focus / front view / from above / from behind / pov / facing viewer / looking back → <perspective>
#     street / pedestrian street / shopping mall / indoor / classroom / chalkboard / school / city street / simple background / wet pavement → <background>
#     rain / night / dusk / wet ground / reflections / city lights → <environment> 或 <atmosphere>
#     streetlamp / flickering light → <lighting> 或 <objects>
#     umbrella / crystal / crystal petals 等物体 → <objects>
#     halo / large breasts / 肤色体型 → <appearance> 或 <body_type>
#     clothing / open clothes / white thighhighs / trench coat → <clothing>
#     tongue out / smile / blush / ahegao / orgasm → <expression>
#     looking at viewer / walking / holding 大多数 → <action>
#     holding hands / grabbing breasts 等两人互动 → <interaction>
#     nipples / pussy / penis / anal 等 NSFW 身体部位和行为 → <other>（保留语义但 NewBie XML 无专属标签）
#
# - <artists> 由 Y 轴 read_y_rows 注入（主源），本资产内的 <artists> 仅作兜底
# - <quality> 合并注入 config.yaml 的 quality_prompt 与本资产的 general.quality
# - info.type（normal / advance / nsfw）保留用于 append_negative_prompt 的 normal 判定
# - description（zh / en）原样保留，与 common_prompts.yaml 字字对齐

